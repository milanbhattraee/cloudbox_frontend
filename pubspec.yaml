name: cloudbox_app
description: "CloudBox - Flutter Android client for the CloudBox storage API"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.5.0
  cached_network_image: ^3.4.1

  # State management
  provider: ^6.1.2

  # File picking / opening / storage paths
  file_picker: 11.0.3
  open_filex: ^4.4.0
  path_provider: ^2.1.3

  # Formatting & misc
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  
  # Cryptography for file hashing
  crypto: ^3.0.3
  
  # Permissions handling
  permission_handler: ^11.0.1
  
  # Local storage for device ID
  shared_preferences: ^2.2.2
  
  # Notifications for sync status
  flutter_local_notifications: ^17.0.0
  
  # Foreground service for background sync
  flutter_foreground_task: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
