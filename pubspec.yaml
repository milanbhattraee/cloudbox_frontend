name: cloudbox_app
description: "CloudBox - Flutter Android client for the CloudBox storage API"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase (must match the backend's Firebase project)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.2
  google_sign_in: ^6.2.2

  # Networking
  dio: ^5.5.0

  # State management
  provider: ^6.1.2

  # File picking / opening / storage paths
  file_picker: 11.0.3
  open_filex: ^4.4.0
  path_provider: ^2.1.3

  # Formatting & misc
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
