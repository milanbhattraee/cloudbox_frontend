org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false

# Pin Gradle to run on Android Studio's bundled JBR instead of whatever JDK
# is on your system PATH. Gradle 8.6 cannot run on very new JDKs (e.g. 25) —
# this avoids "Unsupported class file major version" errors. Android Studio's
# bundled JBR is always a version Gradle/AGP was tested against.
# If your Android Studio is installed somewhere else, update this path
# (or delete the line) to match: run `/usr/libexec/java_home -V` to list
# JDKs installed on your Mac and pick a 17 or 21 one instead.
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
